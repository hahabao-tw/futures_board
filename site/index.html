<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>期貨商公告看板</title>
    <meta
      name="description"
      content="彙整臺灣期貨交易所與 13 家期貨商官網公告區，一頁看完。"
    />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 只取拉丁字母與數字：中文沿用系統既有字型，避免載入數百 KB 的 CJK 字檔 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fbbf24' stroke-width='2' stroke-linecap='round'><path d='M7 3v18M7 7h4v8H7zM17 3v18M17 10h4v6h-4z'/></svg>"
    />
  </head>
  <body>
    <canvas id="candles" aria-hidden="true"></canvas>

    <!-- SVG 圖示庫：介面不用 emoji 當圖示 -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-chart" viewBox="0 0 24 24">
        <path d="M7 3v18M7 7h4v8H7zM17 3v18M17 10h4v6h-4z" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <path d="M15 3h6v6M10 14 21 3M18 13v8H3V6h8" />
      </symbol>
      <symbol id="i-warn" viewBox="0 0 24 24">
        <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" />
        <path d="M12 9v4M12 17h.01" />
      </symbol>
    </svg>

    <p class="notice" id="excluded-notice"></p>

    <header class="topbar">
      <div class="topbar__row">
        <h1>
          <svg class="icon" aria-hidden="true"><use href="#i-chart" /></svg>
          期貨商公告看板
        </h1>
        <p class="scope tabular" id="scope"></p>
      </div>

      <div class="controls">
        <div class="search">
          <svg class="icon icon--search" aria-hidden="true"><use href="#i-search" /></svg>
          <input
            id="search"
            type="search"
            placeholder="搜尋公告標題… （例如：保證金、南電、休市）"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="clear-search" class="ghost" type="button" hidden>清除</button>
        </div>

        <div class="fontsize" role="group" aria-label="字體大小">
          <button id="font-down" type="button" aria-label="縮小字體">A−</button>
          <span id="font-level" class="tabular">字級 2/6</span>
          <button id="font-up" type="button" aria-label="放大字體">A+</button>
        </div>

        <div class="toggle" role="tablist" aria-label="檢視模式">
          <button id="view-board" role="tab" aria-selected="true" class="is-on">看板</button>
          <button id="view-timeline" role="tab" aria-selected="false">時間軸</button>
        </div>
      </div>

      <div class="filters">
        <div class="chips" id="tag-filters" role="group" aria-label="分類篩選"></div>
        <div class="filters__right">
          <label class="switch">
            <input type="checkbox" id="show-margin" />
            <span id="show-margin-label">顯示保證金公告</span>
          </label>
        </div>
      </div>
    </header>

    <main>
      <p class="empty" id="empty" hidden>沒有符合條件的公告。</p>

      <div id="board-wrap">
        <h2 class="section-label section-label--exchange">臺灣期貨交易所</h2>
        <section id="exchange" class="exchange"></section>

        <h2 class="section-label">期貨商 · 依名稱筆劃排序</h2>
        <section id="board" class="board"></section>
      </div>

      <section id="timeline" class="timeline" hidden></section>
    </main>

    <div class="lens" id="lens" aria-hidden="true"></div>

    <footer class="foot">
      <p id="update-info"></p>
      <p id="schedule-info"></p>
      <p>
        資料由臺灣期貨交易所與各期貨商官網公告區自動彙整，僅供快速瀏覽；正式內容以各官網為準。
        <span id="broker-errors" class="errors"></span>
      </p>
      <p>管理員信箱：<a href="mailto:7537@entrust.com.tw">7537@entrust.com.tw</a></p>
    </footer>

    <script src="candles.js" type="module"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>

name: 抓取公告並部署

on:
  schedule:
    # 台灣時間每天 08:00、11:00、15:00、19:00、23:00
    # GitHub cron 只吃 UTC，台灣是 UTC+8，所以往前推 8 小時。
    - cron: '0 0,3,7,11,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'site/data.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: futures-board
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 抓分支目前的狀態，而不是觸發事件當下的 commit。
          # 少了這行，重跑（re-run）會退回舊的 SHA，回寫時就會被遠端拒絕。
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 抓取各期貨商公告
        run: npm run scrape

      # 抓取腳本只在公告有異動時才改寫 data.json。這裡再對齊一次遠端後才推，
      # 避免與其他同時進行的執行互相踩到。
      - name: 回寫 data.json
        id: sync
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain site/data.json)" ]; then
            echo "沒有新公告，略過部署。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp site/data.json "$RUNNER_TEMP/data.json"

          for attempt in 1 2 3; do
            git fetch --depth=1 origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD
            cp "$RUNNER_TEMP/data.json" site/data.json
            git add site/data.json

            if git diff --staged --quiet; then
              echo "遠端已是相同內容，不需回寫。"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "chore: 更新公告資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            if git push; then
              echo "已回寫 data.json。"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "推送被拒（第 ${attempt} 次），重新對齊後再試。"
            sleep 5
          done

          echo "::error::連續三次都推不上去，可能有其他執行正在寫入。"
          exit 1

      - uses: actions/configure-pages@v5
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: site

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

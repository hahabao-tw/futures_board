name: 抓取公告並部署

on:
  schedule:
    # 台灣時間每天 08:00、11:00、15:00、19:00、23:00
    # GitHub cron 只吃 UTC，台灣是 UTC+8，所以往前推 8 小時。
    - cron: '0 0,3,7,11,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'site/data.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: futures-board
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 抓取各期貨商公告
        run: npm run scrape

      # 抓取腳本只在公告有異動時才改寫 data.json，所以這裡直接看檔案動了沒。
      - name: 檢查有無新公告
        id: check
        run: |
          if [ -n "$(git status --porcelain site/data.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "有新公告，將更新網站。"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "沒有新公告，略過部署。"
          fi

      - name: 回寫 data.json
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git commit -m "chore: 更新公告資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: site

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

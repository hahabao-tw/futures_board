name: 抓取公告並部署

on:
  schedule:
    # 台灣時間 08:00–22:00 每小時整點（GitHub cron 用 UTC）
    - cron: '0 0-14 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'site/data.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: futures-board
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Five brokers render their announcements client-side and need a browser.
      - run: npx playwright install --with-deps chromium

      - name: 抓取各期貨商公告
        run: npm run scrape

      - name: 回寫 data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git diff --staged --quiet || git commit -m "chore: 更新公告資料 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
